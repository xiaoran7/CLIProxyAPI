<!-- Gate Console · 弹窗：模型定价管理 -->
<!-- 模型定价管理 Modal -->
<div class="modal-backdrop" id="prices-modal">
<div class="modal modal-wide">
<div class="modal-header">
<div class="modal-title">
<svg fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;color:#34d399;" viewbox="0 0 24 24"><path d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <span data-i18n="pricesModal.title">模型定价与倍率管理 (Model Pricing)</span>
        </div>
<button class="close-btn" onclick="closeModal('prices-modal')">
<svg fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
</div>
<div style="font-size:12px; color:var(--text-muted); margin-bottom:14px;" data-i18n="pricesModal.subtitle">
        配置各模型的每 1M Tokens (美元) 计费基准与倍率。
      </div>
<!-- 添加/编辑表单 -->
<div style="background:#f8fafc; border:1px solid var(--card-border); border-radius:var(--radius-md); padding:12px; margin-bottom:16px;">
<div id="price-form-title" style="font-size:12.5px; font-weight:600; margin-bottom:8px;" data-i18n="pricesModal.addRule">添加 / 编辑定价规则</div>
<input id="price-form-id" type="hidden"/>
<div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap:10px; margin-bottom:10px;">
<div>
<label style="font-size:11px; color:var(--text-dim); display:block; margin-bottom:3px;" data-i18n="pricesModal.patternLabel">模型匹配模式 (Regex/String)</label>
<input class="form-control" id="price-pattern" placeholder="如 gpt-5.6-sol" data-i18n-placeholder="pricesModal.patternPlaceholder" type="text"/>
</div>
<div>
<label style="font-size:11px; color:var(--text-dim); display:block; margin-bottom:3px;" data-i18n="pricesModal.inputPrice">输入价 ($/1M Prompt)</label>
<input class="form-control" id="price-prompt" placeholder="如 3.00" data-i18n-placeholder="pricesModal.inputPricePlaceholder" step="0.01" type="number"/>
</div>
<div>
<label style="font-size:11px; color:var(--text-dim); display:block; margin-bottom:3px;" data-i18n="pricesModal.outputPrice">输出价 ($/1M Completion)</label>
<input class="form-control" id="price-completion" placeholder="如 15.00" data-i18n-placeholder="pricesModal.outputPricePlaceholder" step="0.01" type="number"/>
</div>
<div>
<label style="font-size:11px; color:var(--text-dim); display:block; margin-bottom:3px;" data-i18n="pricesModal.cachePrice">缓存读 ($/1M Cached)</label>
<input class="form-control" id="price-cache" placeholder="如 0.30" data-i18n-placeholder="pricesModal.cachePricePlaceholder" step="0.001" type="number"/>
</div>
<div>
<label style="font-size:11px; color:var(--text-dim); display:block; margin-bottom:3px;" data-i18n="pricesModal.multiplier">价格乘数 (倍率)</label>
<input class="form-control" id="price-multiplier" placeholder="1.0" step="0.1" type="number" value="1.0"/>
</div>
</div>
<div style="display:flex; justify-content:flex-end; gap:8px;">
<button class="btn btn-secondary btn-sm" onclick="resetPriceForm()" data-i18n="common.reset">重置</button>
<button class="btn btn-sm" onclick="saveModelPrice()" data-i18n="pricesModal.saveRule">保存规则</button>
</div>
</div>
<!-- 定价规则列表 -->
<div style="max-height: 320px; overflow-y: auto;">
<table>
<thead>
<tr>
<th data-i18n="prices.thPattern">模型匹配模式</th>
<th data-i18n="prices.thInput">输入价 ($/1M)</th>
<th data-i18n="prices.thOutput">输出价 ($/1M)</th>
<th data-i18n="prices.thCache">缓存读 ($/1M)</th>
<th data-i18n="prices.thMultiplier">倍率</th>
<th style="text-align: right;" data-i18n="table.thActions">操作</th>
</tr>
</thead>
<tbody id="prices-tbody">
<tr class="ui-skeleton-row"><td><span class="ui-skeleton ui-skeleton-line" style="width:85%;"></span></td><td><span class="ui-skeleton ui-skeleton-line" style="width:60%;"></span></td><td><span class="ui-skeleton ui-skeleton-line" style="width:70%;"></span></td><td><span class="ui-skeleton ui-skeleton-line" style="width:55%;"></span></td><td><span class="ui-skeleton ui-skeleton-line" style="width:75%;"></span></td><td style="text-align:right;"><span class="ui-skeleton ui-skeleton-line" style="width:45px;display:inline-block;"></span></td></tr>
<tr class="ui-skeleton-row"><td><span class="ui-skeleton ui-skeleton-line" style="width:75%;"></span></td><td><span class="ui-skeleton ui-skeleton-line" style="width:65%;"></span></td><td><span class="ui-skeleton ui-skeleton-line" style="width:80%;"></span></td><td><span class="ui-skeleton ui-skeleton-line" style="width:50%;"></span></td><td><span class="ui-skeleton ui-skeleton-line" style="width:70%;"></span></td><td style="text-align:right;"><span class="ui-skeleton ui-skeleton-line" style="width:45px;display:inline-block;"></span></td></tr>
</tbody>
</table>
</div>
<div class="modal-actions">
<button class="btn btn-secondary" data-i18n="common.close" onclick="closeModal('prices-modal')">关闭</button>
</div>
</div>
</div>
<!-- 上游凭证优先级调整 Modal -->
<div class="modal-backdrop" id="upstream-priority-modal">
<div class="modal modal-md">
<div class="modal-header">
<div class="modal-title" style="display:flex; align-items:center; gap:8px;">
<svg fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;color:#fbbf24;" viewbox="0 0 24 24"><path d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <span data-i18n="prioModal.title">调整上游授权调度优先级</span>
        </div>
<button class="close-btn" onclick="closeModal('upstream-priority-modal')">
<svg fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
</div>
<div style="margin-bottom: 16px;">
<div style="background: rgba(255,255,255,0.04); border: 1px solid var(--card-border); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 14px;">
<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;">
<span style="font-size:11.5px; color:var(--text-dim);" data-i18n="prioModal.fileLabel">凭证文件</span>
<span id="prio-modal-filename" style="font-family:var(--mono); font-size:12px; color:var(--text-muted);">--</span>
</div>
<div style="display:flex; align-items:center; justify-content:space-between;">
<span style="font-size:11.5px; color:var(--text-dim);" data-i18n="prioModal.accountLabel">授权账号</span>
<span id="prio-modal-email" style="font-weight:600; font-size:13px; color:var(--text-main);">--</span>
</div>
</div>
<div style="margin-bottom: 14px;">
<label style="font-size: 12px; font-weight: 600; color: var(--text-main); display: block; margin-bottom: 6px;" data-i18n="prioModal.priorityLabel">
            调度优先级 Priority (0 ~ 1000)
          </label>
<div style="display: flex; gap: 8px; align-items: center;">
<input class="form-control num" id="prio-modal-input" max="1000" min="0" placeholder="0" step="1" style="font-size: 15px; font-weight: 700; width: 120px;" type="number"/>
<span style="font-size: 12px; color: var(--text-muted);" data-i18n="prioModal.priorityHint">数值越大越优先调度</span>
</div>
<div id="prio-modal-default-hint" style="font-size: 11px; color: var(--text-dim); margin-top: 6px;" data-i18n="prioModal.defaultTier">未显式设置时的默认档位：P0</div>
</div>
<!-- 常用预设快捷按钮 -->
<div style="margin-bottom: 16px;">
<div style="font-size: 11px; color: var(--text-dim); margin-bottom: 6px;" data-i18n="prioModal.presetsTitle">快捷预设档位：</div>
<div style="display:flex; flex-wrap:wrap; gap:6px;">
<button class="btn btn-secondary btn-sm" onclick="setPresetPriority(30)" title="P30 最高优先级，优先打光此账号" data-i18n-title="prioModal.preset30Title" data-i18n="prioModal.preset30" type="button">P30 · 最高优</button>
<button class="btn btn-secondary btn-sm" onclick="setPresetPriority(20)" title="P20 高优先级" data-i18n-title="prioModal.preset20Title" data-i18n="prioModal.preset20" type="button">P20 · 优先</button>
<button class="btn btn-secondary btn-sm" onclick="setPresetPriority(10)" title="P10 标准档（注意：未显式设置的凭据默认是 P0）" data-i18n-title="prioModal.preset10Title" data-i18n="prioModal.preset10" type="button">P10 · 标准</button>
<button class="btn btn-secondary btn-sm" onclick="setPresetPriority(5)" title="P5 次选备用" data-i18n-title="prioModal.preset5Title" data-i18n="prioModal.preset5" type="button">P5 · 备用</button>
<button class="btn btn-secondary btn-sm" onclick="setPresetPriority(0)" title="P0 兜底，未显式设置的凭据即为该档位" data-i18n-title="prioModal.preset0Title" data-i18n="prioModal.preset0" type="button">P0 · 兜底</button>
</div>
</div>
<!-- 启用/停用开关 -->
<div style="background: rgba(0,0,0,0.25); border: 1px solid var(--card-border); border-radius: var(--radius-sm); padding: 12px; display:flex; align-items:center; justify-content:space-between;">
<div>
<div style="font-size: 12.5px; font-weight: 600; color: var(--text-main);" data-i18n="prioModal.statusLabel">账号可用状态</div>
<div style="font-size: 11.5px; color: var(--text-dim);" data-i18n="prioModal.statusHint">停用后 CPA 调度器将暂时跳过此账号</div>
</div>
<label class="switch-toggle">
<input id="prio-modal-status-toggle" type="checkbox"/>
<span class="slider" id="prio-modal-status-slider"></span>
</label>
</div>
<div style="margin-top: 12px; font-size: 11px; color: var(--text-dim); line-height: 1.5;" data-i18n="prioModal.rulesHint">
          调度规则：CPA 优先调度优先级数值更高的账号；同优先级内按已配置策略（轮询或 fill-first）分发。
        </div>
</div>
<div class="modal-actions">
<button class="btn btn-secondary" data-i18n="common.cancel" onclick="closeModal('upstream-priority-modal')">取消</button>
<button class="btn btn-primary" id="prio-modal-save-btn" onclick="saveUpstreamPriority()" data-i18n="prioModal.save">保存并生效</button>
</div>
</div>
</div>
