<span id="btn-locale-text">EN</span>
</button>

<div class="polling-capsule" title="全局自动刷新周期（全站统一权威定时器）" data-i18n-title="top.pollingTitle">

</svg>
<div aria-label="全局自动刷新间隔" data-i18n-aria-label="top.pollingAria" class="dropdown" id="polling-interval-dropdown"></div>

<span id="quota-probe-text" data-i18n="top.probeDetecting">探针检测中</span>
</button>

<span id="btn-auth-text" data-i18n="common.key">密钥</span>
</button>

</button>
