<!-- Gate Console · 弹窗：OpenRouter 独立账号管理 -->
<!-- OpenRouter 独立账号管理 Modal (Console 自治) -->
<div class="modal-backdrop" id="modal-openrouter-accounts">
<div class="modal modal-wide" style="max-width:880px;">
<div class="modal-header">
<div class="modal-title" style="display:flex; align-items:center; gap:8px;">
<svg fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;color:#3b82f6;" viewbox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke-linecap="round" stroke-linejoin="round"></path><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path></svg>
  <span data-i18n="orModal.title">OpenRouter 原生账号管理 (Console 自治)</span>
</div>
<button class="close-btn" onclick="closeModal('modal-openrouter-accounts')">
<svg fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
</div>
<div style="margin-bottom:14px; font-size:12px; color:var(--text-muted); display:flex; justify-content:space-between; align-items:center;">
  <span data-i18n="orModal.subtitle">管理 OpenRouter 账号与配额统计凭据。</span>
  <button class="btn btn-sm btn-primary" onclick="showAddOpenRouterForm()" style="white-space:nowrap; padding:4px 10px;" data-i18n="orModal.addAccount">添加账号</button>
</div>

<!-- 录入 / 编辑表单区域 -->
<div id="openrouter-form-card" style="display:none; background:var(--bg-subtle, rgba(0,0,0,0.02)); border:1px solid var(--border-subtle, rgba(0,0,0,0.08)); border-radius:8px; padding:14px; margin-bottom:16px;">
  <div style="font-size:13px; font-weight:600; margin-bottom:10px; color:var(--text-main);" id="openrouter-form-title" data-i18n="orModal.addTitle">添加 OpenRouter 账号</div>
  <input type="hidden" id="openrouter-form-id"/>
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px;">
    <div class="form-group" style="margin:0;">
      <label style="font-size:11.5px; color:var(--text-muted); margin-bottom:3px; display:block;" data-i18n="orModal.nameLabel">账号名称 / 标识 *</label>
      <input class="form-control" id="openrouter-form-name" placeholder="如：我的主号 / or-account-1" data-i18n-placeholder="orModal.namePlaceholder" style="font-size:12px;" type="text"/>
    </div>
    <div class="form-group" style="margin:0;">
      <label style="font-size:11.5px; color:var(--text-muted); margin-bottom:3px; display:block;" data-i18n="orModal.noteLabel">备注说明 (可选)</label>
      <input class="form-control" id="openrouter-form-note" placeholder="可选备注说明" data-i18n-placeholder="orModal.notePlaceholder" style="font-size:12px;" type="text"/>
    </div>
  </div>
  <div class="form-group" style="margin-bottom:10px;">
    <label style="font-size:11.5px; color:var(--text-muted); margin-bottom:3px; display:block;" data-i18n="orModal.apiKeyLabel">OpenRouter API Key (sk-or-v1-...)</label>
    <input class="form-control" id="openrouter-form-apikey" autocomplete="off" placeholder="sk-or-v1-..." style="font-family:var(--mono); font-size:12px;" type="password"/>
    <div style="font-size:10.5px; color:var(--text-dim); margin-top:2px;" data-i18n="orModal.apiKeyHint">留空保留原 API Key。</div>
  </div>
  <div class="form-group" style="margin-bottom:12px;">
    <label style="font-size:11.5px; color:var(--text-muted); margin-bottom:3px; display:block;" data-i18n="orModal.mgmtKeyLabel">Management Key (sk-or-v1-...)</label>
    <input class="form-control" id="openrouter-form-mgmtkey" autocomplete="off" placeholder="sk-or-v1-..." style="font-family:var(--mono); font-size:12px;" type="password"/>
    <div style="font-size:10.5px; color:var(--text-dim); margin-top:2px;" data-i18n="orModal.mgmtKeyHint">留空保留原 Management Key。</div>
  </div>
  <div style="display:flex; justify-content:flex-end; gap:8px;">
    <button class="btn btn-secondary btn-sm" data-i18n="common.cancel" onclick="hideOpenRouterForm()" type="button">取消</button>
    <button class="btn btn-primary btn-sm" onclick="submitOpenRouterAccount()" id="openrouter-form-submit-btn" type="button" data-i18n="orModal.save">保存账号</button>
  </div>
</div>

<!-- 账号列表表格 -->
<div style="overflow-x:auto; max-height:420px;">
  <table class="table" style="width:100%; font-size:12px; margin:0;">
    <thead>
      <tr style="text-align:left; border-bottom:1px solid var(--border-subtle, rgba(0,0,0,0.06)); color:var(--text-muted);">
        <th style="padding:8px 6px;" data-i18n="or.thName">账号名称</th>
        <th style="padding:8px 6px;" data-i18n="or.thNote">备注</th>
        <th style="padding:8px 6px;">API Key</th>
        <th style="padding:8px 6px;" data-i18n="or.thMgmtKey">Management Key (次数统计)</th>
        <th style="padding:8px 6px;" data-i18n="or.thTodayCalls">今日已调</th>
        <th style="padding:8px 6px; text-align:right;" data-i18n="table.thActions">操作</th>
      </tr>
    </thead>
    <tbody id="openrouter-accounts-tbody">
      <tr class="ui-skeleton-row"><td><span class="ui-skeleton ui-skeleton-line" style="width:70%;"></span></td><td><span class="ui-skeleton ui-skeleton-line" style="width:85%;"></span></td><td><span class="ui-skeleton ui-skeleton-line" style="width:60%;"></span></td><td><span class="ui-skeleton ui-skeleton-line" style="width:75%;"></span></td><td><span class="ui-skeleton ui-skeleton-pill" style="width:60px;height:20px;"></span></td><td style="text-align:right;"><span class="ui-skeleton ui-skeleton-line" style="width:45px;display:inline-block;"></span></td></tr>
      <tr class="ui-skeleton-row"><td><span class="ui-skeleton ui-skeleton-line" style="width:80%;"></span></td><td><span class="ui-skeleton ui-skeleton-line" style="width:65%;"></span></td><td><span class="ui-skeleton ui-skeleton-line" style="width:75%;"></span></td><td><span class="ui-skeleton ui-skeleton-line" style="width:55%;"></span></td><td><span class="ui-skeleton ui-skeleton-pill" style="width:60px;height:20px;"></span></td><td style="text-align:right;"><span class="ui-skeleton ui-skeleton-line" style="width:45px;display:inline-block;"></span></td></tr>
    </tbody>
  </table>
</div>
<div class="modal-actions" style="margin-top:14px;">
  <button class="btn btn-secondary" data-i18n="common.close" onclick="closeModal('modal-openrouter-accounts')">关闭</button>
</div>
</div>
</div>
