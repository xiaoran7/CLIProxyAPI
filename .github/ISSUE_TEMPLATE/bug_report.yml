name: "Bug Report"
description: "File a bug report or regression issue"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please search existing issues first before submitting.
  - type: dropdown
    id: provider
    attributes:
      label: Provider / Integration
      description: Which provider or integration is affected?
      options:
        - "Anthropic Claude"
        - "OpenAI / Codex"
        - "Google Gemini / Antigravity"
        - "Tencent WorkBuddy / CodeBuddy"
        - "OpenCode"
        - "Kimi / Moonshot"
        - "xAI Grok"
        - "Meta Muse"
        - "Generic OpenAI-Compatible"
        - "Management Console (CPAMC)"
        - "Other / Gateway Core"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model Name
      description: The exact model ID requested (e.g. claude-sonnet-5-5, gpt-6-astra, deepseek-v4.1-flash).
      placeholder: "e.g. claude-sonnet-5-5"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client Application
      description: Which client is sending requests to the proxy? (e.g. Claude Code CLI, Codex CLI, Cursor, Windsurf, Aider, cURL).
      placeholder: "e.g. Claude Code CLI"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the unexpected behavior is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps or minimal cURL / request payload to reproduce the behavior.
      placeholder: |
        1. Start server with `...`
        2. Send request: `curl ...`
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Output
      description: Paste relevant sanitized proxy logs (sensitive keys redacted).
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS version and Go version (e.g. Linux Ubuntu 24.04, Go 1.26.1).
      placeholder: "e.g. Linux Ubuntu 24.04 / Windows 11 / macOS 15, Go 1.26"
    validations:
      required: true
