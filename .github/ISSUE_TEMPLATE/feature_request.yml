name: "Feature Request"
description: "Suggest an idea or architectural improvement"
title: "[Feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing an enhancement to CLI Proxy API!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the limitation or pain point is.
      placeholder: "I am always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen and how it fits into the gateway architecture.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or workarounds you have considered.
  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      options:
        - "Provider Integration"
        - "Load Balancing / Scheduling Strategy"
        - "Session Affinity / Prompt Caching"
        - "Protocol Translation / Thinking Pipeline"
        - "CPAMC Management Dashboard"
        - "CLI / OAuth / Authentication"
        - "Documentation / Examples"
    validations:
      required: true
